name: Publish sing-box build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful build workflow run ID"
        required: true
        type: string
      publish_release:
        description: "Publish type"
        required: true
        type: choice
        options:
          - pre-release
          - release
        default: pre-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish build ${{ inputs.build_run_id }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate build workflow run
        id: build_run
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
          EXPECTED_WORKFLOW: .github/workflows/build.yml
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid build run ID: $BUILD_RUN_ID" >&2
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          workflow_id=$(jq -r '.workflow_id' <<< "$run_json")
          workflow_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id")

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EXPECTED_BRANCH" \
            '.repository.full_name == $repository
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .head_branch == $branch' \
            <<< "$run_json" >/dev/null
          jq -e \
            --arg workflow "$EXPECTED_WORKFLOW" \
            '.path == $workflow' \
            <<< "$workflow_json" >/dev/null

          echo "head_sha=$(jq -r '.head_sha' <<< "$run_json")" >> "$GITHUB_OUTPUT"

      - name: Download build manifest
        uses: actions/download-artifact@v8
        with:
          name: build-manifest
          path: build-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Validate build manifest
        id: manifest
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ steps.build_run.outputs.head_sha }}
          EXPECTED_WORKFLOW: .github/workflows/build.yml
        run: |
          set -euo pipefail
          manifest=build-metadata/build-manifest.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EXPECTED_BRANCH" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg workflow "$EXPECTED_WORKFLOW" \
            --argjson run_id "$BUILD_RUN_ID" \
            '.schema_version == 1
              and .workflow == $workflow
              and .repository == $repository
              and .head_branch == $branch
              and .head_sha == $head_sha
              and .run_id == $run_id
              and (.version | type == "string" and test("^[0-9A-Za-z][0-9A-Za-z.+-]*$"))
              and (.channel | type == "string" and test("^[0-9A-Za-z._-]+$"))
              and (.source_repository | type == "string" and test("^[0-9A-Za-z._-]+/[0-9A-Za-z._-]+$"))
              and (.source_sha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.built_at | type == "string" and length > 0)
              and (.files | type == "array" and length > 0)
              and ((.files | map(.path) | unique | length) == (.files | length))
              and all(.files[];
                (.path | type == "string" and length > 0)
                and (.path | startswith("/") | not)
                and (.path | split("/") | all(. != ".."))
                and (.sha256 | test("^[0-9a-f]{64}$"))
                and (.size | type == "number" and . >= 0))' \
            "$manifest" >/dev/null

          {
            echo "version=$(jq -r '.version' "$manifest")"
            echo "channel=$(jq -r '.channel' "$manifest")"
            echo "source_repository=$(jq -r '.source_repository' "$manifest")"
            echo "source_sha=$(jq -r '.source_sha' "$manifest")"
            echo "built_at=$(jq -r '.built_at' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify artifact files
        run: |
          set -euo pipefail
          jq -S '.files | sort_by(.path)' \
            build-metadata/build-manifest.json > expected-files.json

          {
            while IFS= read -r -d '' file; do
              relative_path=${file#artifacts/}
              sha256=$(sha256sum "$file" | awk '{print $1}')
              size=$(stat -c '%s' "$file")
              jq -nc \
                --arg path "$relative_path" \
                --arg sha256 "$sha256" \
                --argjson size "$size" \
                '{path: $path, sha256: $sha256, size: $size}'
            done < <(find artifacts -type f -print0 | sort -z)
          } | jq -s -S 'sort_by(.path)' > actual-files.json

          diff -u expected-files.json actual-files.json

      - name: Generate release notes
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          CHANNEL: ${{ steps.manifest.outputs.channel }}
          SOURCE_REPOSITORY: ${{ steps.manifest.outputs.source_repository }}
          SOURCE_SHA: ${{ steps.manifest.outputs.source_sha }}
          BUILT_AT: ${{ steps.manifest.outputs.built_at }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "## sing-box v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Channel | \`${CHANNEL}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| sing-box Commit | [\`${SOURCE_SHA}\`](https://github.com/${SOURCE_REPOSITORY}/commit/${SOURCE_SHA}) |"
            echo "| Built At | ${BUILT_AT} |"
            echo "| Published At | ${PUBLISHED_AT} |"
            echo "| Build Run ID | [${BUILD_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}) |"
            echo "| Publish Run ID | [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } > release-notes.md
          cat release-notes.md

      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/${tag}"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.manifest.outputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [[ "$PUBLISH_RELEASE" == "pre-release" ]]; then
            release_flag=--prerelease
          else
            release_flag=--latest
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0 | sort -z)
          gh release create "$tag" "${files[@]}" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            "$release_flag"
